services:
  postgres:
    image: postgres:16-alpine
    container_name: nodejs-capstone-project
    restart: unless-stopped

    ports:
      - "5440:5432"

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PASSWORD}
      POSTGRES_DB: nodejs-capstone

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
